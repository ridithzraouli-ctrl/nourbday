<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>♡</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Quicksand:wght@400;500;600&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at 20% 20%, rgba(255,255,255,0.8) 0 1px, transparent 2px),
                radial-gradient(circle at 80% 70%, rgba(255,255,255,0.7) 0 1px, transparent 2px),
                linear-gradient(135deg, #f5e9ed, #eadde5 50%, #f7edf0);
            background-size: 130px 130px, 170px 170px, 100% 100%;
            color: #594b55;
            font-family: 'Quicksand', sans-serif;
            overflow: hidden;
            user-select: none;
        }

        body::before,
        body::after {
            content: "✦";
            position: fixed;
            font-family: 'Cormorant Garamond', serif;
            font-size: 90px;
            color: rgba(255,255,255,0.45);
            pointer-events: none;
            z-index: 1;
        }

        body::before {
            top: 20px;
            left: 30px;
        }

        body::after {
            bottom: 10px;
            right: 35px;
            font-size: 70px;
        }

        .falling {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }

        .falling span {
            position: absolute;
            top: -20px;
            color: rgba(255,255,255,0.48);
            font-family: 'Cormorant Garamond', serif;
            font-size: 10px;
            animation: fall linear infinite;
        }

        .falling span:nth-child(1) {
            left: 8%;
            animation-duration: 13s;
            animation-delay: -4s;
            font-size: 8px;
        }

        .falling span:nth-child(2) {
            left: 18%;
            animation-duration: 17s;
            animation-delay: -10s;
            font-size: 6px;
        }

        .falling span:nth-child(3) {
            left: 29%;
            animation-duration: 14s;
            animation-delay: -2s;
            font-size: 9px;
        }

        .falling span:nth-child(4) {
            left: 41%;
            animation-duration: 19s;
            animation-delay: -13s;
            font-size: 7px;
        }

        .falling span:nth-child(5) {
            left: 52%;
            animation-duration: 15s;
            animation-delay: -7s;
            font-size: 6px;
        }

        .falling span:nth-child(6) {
            left: 64%;
            animation-duration: 18s;
            animation-delay: -11s;
            font-size: 9px;
        }

        .falling span:nth-child(7) {
            left: 76%;
            animation-duration: 16s;
            animation-delay: -5s;
            font-size: 7px;
        }

        .falling span:nth-child(8) {
            left: 87%;
            animation-duration: 20s;
            animation-delay: -15s;
            font-size: 6px;
        }

        .falling span:nth-child(9) {
            left: 95%;
            animation-duration: 14s;
            animation-delay: -9s;
            font-size: 8px;
        }

        .falling span:nth-child(10) {
            left: 34%;
            animation-duration: 21s;
            animation-delay: -18s;
            font-size: 5px;
        }

        @keyframes fall {
            0% {
                transform: translateY(-30px) translateX(0) rotate(0deg);
                opacity: 0;
            }

            10% {
                opacity: 0.5;
            }

            50% {
                transform: translateY(50vh) translateX(18px) rotate(90deg);
            }

            90% {
                opacity: 0.35;
            }

            100% {
                transform: translateY(110vh) translateX(-15px) rotate(180deg);
                opacity: 0;
            }
        }

        .page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 45px 20px;
            position: relative;
            z-index: 2;
        }

        .ornament {
            font-family: 'Cormorant Garamond', serif;
            color: #a88696;
            font-size: 20px;
            letter-spacing: 10px;
            margin-bottom: 12px;
        }

        h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(42px, 8vw, 70px);
            font-weight: 500;
            color: #594b55;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        .subtitle {
            font-family: 'Cormorant Garamond', serif;
            font-size: 19px;
            color: #9b7f8d;
            letter-spacing: 3px;
            margin-bottom: 35px;
        }

        .game-container {
            width: min(560px, 100%);
            padding: 30px;
            background: rgba(255, 250, 252, 0.65);
            border: 1px solid rgba(255,255,255,0.85);
            border-radius: 28px;
            box-shadow:
                0 20px 60px rgba(101, 75, 91, 0.13),
                inset 0 0 30px rgba(255,255,255,0.35);
            backdrop-filter: blur(12px);
        }

        .game {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
            max-width: 450px;
            margin: 0 auto;
        }

        .memory-button {
            aspect-ratio: 1;
            border: 2px solid rgba(255,255,255,0.85);
            border-radius: 28px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            box-shadow:
                0 10px 25px rgba(95,70,85,0.12),
                inset 0 0 20px rgba(255,255,255,0.35);
            transition:
                transform 0.2s ease,
                filter 0.2s ease,
                box-shadow 0.2s ease;
        }

        .memory-button::before {
            content: "";
            position: absolute;
            inset: 10px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.35);
            pointer-events: none;
        }

        .memory-button::after {
            content: "✧";
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Cormorant Garamond', serif;
            font-size: 48px;
            color: rgba(255,255,255,0.62);
            pointer-events: none;
            transition: transform 0.25s ease;
        }

        .memory-button.one {
            background: linear-gradient(145deg, #dcb8c7, #cda7b8);
        }

        .memory-button.two {
            background: linear-gradient(145deg, #c7b5d8, #b39dc9);
        }

        .memory-button.three {
            background: linear-gradient(145deg, #d9c4b2, #c9ae98);
        }

        .memory-button.four {
            background: linear-gradient(145deg, #b8c9c1, #9fb8ae);
        }

        .memory-button:hover {
            transform: translateY(-3px);
        }

        .memory-button:active {
            transform: scale(0.96);
        }

        .memory-button.lit {
            transform: scale(1.045);
            filter: brightness(1.3);
            box-shadow:
                0 0 0 5px rgba(255,255,255,0.5),
                0 0 38px rgba(255,255,255,0.75),
                0 15px 35px rgba(95,70,85,0.18);
        }

        .memory-button.lit::after {
            transform: scale(1.25) rotate(15deg);
        }

        .memory-button.wrong {
            animation: shake 0.4s ease;
            filter: brightness(0.8);
        }

        @keyframes shake {
            0%, 100% {
                transform: translateX(0);
            }

            20% {
                transform: translateX(-7px);
            }

            40% {
                transform: translateX(7px);
            }

            60% {
                transform: translateX(-5px);
            }

            80% {
                transform: translateX(5px);
            }
        }

        .bottom-ornament {
            margin-top: 30px;
            color: #a88696;
            font-family: 'Cormorant Garamond', serif;
            font-size: 24px;
            letter-spacing: 12px;
        }

        .win-screen {
            position: fixed;
            inset: 0;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
            background: rgba(72, 54, 65, 0.35);
            backdrop-filter: blur(8px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        .win-screen.show {
            opacity: 1;
            pointer-events: auto;
        }

        .win-box {
            width: min(520px, 100%);
            padding: 55px 30px;
            text-align: center;
            background: rgba(255,248,251,0.96);
            border: 1px solid white;
            border-radius: 30px;
            box-shadow: 0 30px 80px rgba(50,35,45,0.25);
            animation: appear 0.6s ease;
        }

        @keyframes appear {
            from {
                transform: scale(0.8);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .win-decoration {
            color: #aa8798;
            font-family: 'Cormorant Garamond', serif;
            font-size: 27px;
            letter-spacing: 12px;
            margin-bottom: 20px;
        }

        .win-box h2 {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(40px, 9vw, 65px);
            font-weight: 600;
            color: #594b55;
            margin-bottom: 30px;
        }

        .next-button {
            border: none;
            background: #a88696;
            color: white;
            font-family: 'Quicksand', sans-serif;
            font-size: 16px;
            letter-spacing: 3px;
            padding: 15px 40px;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s ease, background 0.2s ease;
        }

        .next-button:hover {
            transform: translateY(-3px);
            background: #947184;
        }

        canvas {
            position: fixed;
            inset: 0;
            z-index: 30;
            pointer-events: none;
        }

        @media (max-width: 600px) {
            .page {
                padding: 35px 12px;
            }

            .game-container {
                padding: 18px;
                border-radius: 22px;
            }

            .game {
                gap: 12px;
            }

            .memory-button {
                border-radius: 21px;
            }

            .memory-button::before {
                inset: 7px;
                border-radius: 15px;
            }

            .memory-button::after {
                font-size: 38px;
            }

            .subtitle {
                margin-bottom: 25px;
            }
        }
    </style>
</head>

<body>

    <div class="falling">
        <span>✦</span>
        <span>✧</span>
        <span>✦</span>
        <span>✧</span>
        <span>✦</span>
        <span>✧</span>
        <span>✦</span>
        <span>✧</span>
        <span>✦</span>
        <span>✧</span>
    </div>

    <canvas id="confetti"></canvas>

    <main class="page">

        <div class="ornament">✦　⋆　✦</div>

        <h1>Memory</h1>

        <div class="subtitle">♡　remember the pattern　♡</div>

        <section class="game-container">

            <div class="game">

                <button class="memory-button one" data-number="0"></button>

                <button class="memory-button two" data-number="1"></button>

                <button class="memory-button three" data-number="2"></button>

                <button class="memory-button four" data-number="3"></button>

            </div>

        </section>

        <div class="bottom-ornament">✧　·　✧　·　✧</div>

    </main>

    <div class="win-screen" id="winScreen">

        <div class="win-box">

            <div class="win-decoration">✦　♡　✦</div>

            <h2>YAY GOODJOBBB</h2>

            <button class="next-button" onclick="goNext()">next</button>

        </div>

    </div>

    <script>

        const buttons = document.querySelectorAll(".memory-button");
        const winScreen = document.getElementById("winScreen");

        const TOTAL_ROUNDS = 7;

        let sequence = [];
        let playerPosition = 0;
        let round = 0;

        let showingSequence = false;
        let acceptingInput = false;

        let audioContext = null;

        const notes = [
            261.63,
            329.63,
            392.00,
            523.25
        ];

        function startAudio() {

            if (!audioContext) {

                audioContext = new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();

            }

            if (audioContext.state === "suspended") {
                audioContext.resume();
            }

        }

        function playButtonSound(number) {

            startAudio();

            const oscillator =
                audioContext.createOscillator();

            const gain =
                audioContext.createGain();

            oscillator.type = "sine";

            oscillator.frequency.value =
                notes[number];

            gain.gain.setValueAtTime(
                0.0001,
                audioContext.currentTime
            );

            gain.gain.exponentialRampToValueAtTime(
                0.18,
                audioContext.currentTime + 0.025
            );

            gain.gain.exponentialRampToValueAtTime(
                0.0001,
                audioContext.currentTime + 0.42
            );

            oscillator.connect(gain);
            gain.connect(audioContext.destination);

            oscillator.start();

            oscillator.stop(
                audioContext.currentTime + 0.42
            );

        }

        function playWinSound() {

            startAudio();

            const winNotes = [
                523.25,
                659.25,
                783.99,
                1046.50
            ];

            winNotes.forEach((note, index) => {

                setTimeout(() => {

                    const oscillator =
                        audioContext.createOscillator();

                    const gain =
                        audioContext.createGain();

                    oscillator.type = "sine";

                    oscillator.frequency.value =
                        note;

                    gain.gain.setValueAtTime(
                        0.0001,
                        audioContext.currentTime
                    );

                    gain.gain.exponentialRampToValueAtTime(
                        0.15,
                        audioContext.currentTime + 0.025
                    );

                    gain.gain.exponentialRampToValueAtTime(
                        0.0001,
                        audioContext.currentTime + 0.4
                    );

                    oscillator.connect(gain);
                    gain.connect(audioContext.destination);

                    oscillator.start();

                    oscillator.stop(
                        audioContext.currentTime + 0.4
                    );

                }, index * 90);

            });

        }

        function playWrongSound() {

            startAudio();

            const oscillator =
                audioContext.createOscillator();

            const gain =
                audioContext.createGain();

            oscillator.type = "sine";

            oscillator.frequency.setValueAtTime(
                170,
                audioContext.currentTime
            );

            oscillator.frequency.exponentialRampToValueAtTime(
                80,
                audioContext.currentTime + 0.3
            );

            gain.gain.setValueAtTime(
                0.0001,
                audioContext.currentTime
            );

            gain.gain.exponentialRampToValueAtTime(
                0.13,
                audioContext.currentTime + 0.025
            );

            gain.gain.exponentialRampToValueAtTime(
                0.0001,
                audioContext.currentTime + 0.3
            );

            oscillator.connect(gain);
            gain.connect(audioContext.destination);

            oscillator.start();

            oscillator.stop(
                audioContext.currentTime + 0.3
            );

        }

        function lightButton(number) {

            return new Promise(resolve => {

                const button = buttons[number];

                button.classList.add("lit");

                playButtonSound(number);

                setTimeout(() => {

                    button.classList.remove("lit");

                    setTimeout(resolve, 110);

                }, 500);

            });

        }        async function showSequence() {

            showingSequence = true;
            acceptingInput = false;

            await new Promise(resolve =>
                setTimeout(resolve, 650)
            );

            for (const number of sequence) {

                await lightButton(number);

            }

            showingSequence = false;
            acceptingInput = true;

            playerPosition = 0;

        }

        function addToSequence() {

            sequence.push(
                Math.floor(Math.random() * 4)
            );

        }

        function startRound() {

            addToSequence();

            showSequence();

        }

        function buttonPressed(number) {

            if (
                !acceptingInput ||
                showingSequence
            ) {
                return;
            }

            const button = buttons[number];

            button.classList.add("lit");

            playButtonSound(number);

            setTimeout(() => {

                button.classList.remove("lit");

            }, 220);

            if (
                number !==
                sequence[playerPosition]
            ) {

                wrong();

                return;

            }

            playerPosition++;

            if (
                playerPosition ===
                sequence.length
            ) {

                acceptingInput = false;

                round++;

                if (round >= TOTAL_ROUNDS) {

                    setTimeout(() => {

                        win();

                    }, 700);

                    return;

                }

                setTimeout(() => {

                    startRound();

                }, 800);

            }

        }

        function wrong() {

            acceptingInput = false;

            playWrongSound();

            buttons.forEach(button => {

                button.classList.add("wrong");

            });

            setTimeout(() => {

                buttons.forEach(button => {

                    button.classList.remove("wrong");

                });

                sequence = [];

                playerPosition = 0;

                round = 0;

                setTimeout(() => {

                    startRound();

                }, 450);

            }, 700);

        }

        buttons.forEach(button => {

            button.addEventListener(
                "pointerdown",
                () => {

                    startAudio();

                    const number =
                        Number(button.dataset.number);

                    buttonPressed(number);

                }
            );

        });

        function win() {

            acceptingInput = false;

            winScreen.classList.add("show");

            playWinSound();

            startConfetti();

        }

        function goNext() {

            window.location.href = "letter.html";

        }

        const canvas =
            document.getElementById("confetti");

        const ctx =
            canvas.getContext("2d");

        let confetti = [];

        let animation;

        function resizeCanvas() {

            canvas.width =
                window.innerWidth;

            canvas.height =
                window.innerHeight;

        }

        window.addEventListener(
            "resize",
            resizeCanvas
        );

        resizeCanvas();

        function startConfetti() {

            confetti = [];

            for (let i = 0; i < 180; i++) {

                confetti.push({

                    x:
                        Math.random() *
                        canvas.width,

                    y:
                        -Math.random() *
                        canvas.height,

                    size:
                        Math.random() *
                        7 + 4,

                    speed:
                        Math.random() *
                        4 + 2,

                    drift:
                        Math.random() *
                        2 - 1,

                    rotation:
                        Math.random() *
                        Math.PI,

                    rotationSpeed:
                        Math.random() *
                        0.15 - 0.075

                });

            }

            animateConfetti();

        }

        function animateConfetti() {

            ctx.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );

            confetti.forEach(piece => {

                piece.y += piece.speed;

                piece.x += piece.drift;

                piece.rotation +=
                    piece.rotationSpeed;

                ctx.save();

                ctx.translate(
                    piece.x,
                    piece.y
                );

                ctx.rotate(
                    piece.rotation
                );

                ctx.fillStyle =
                    `hsl(${Math.random() * 360}, 35%, 75%)`;

                ctx.fillRect(
                    -piece.size / 2,
                    -piece.size / 2,
                    piece.size,
                    piece.size * 0.6
                );

                ctx.restore();

            });

            confetti =
                confetti.filter(
                    piece =>
                        piece.y <
                        canvas.height + 30
                );

            if (confetti.length > 0) {

                animation =
                    requestAnimationFrame(
                        animateConfetti
                    );

            } else {

                cancelAnimationFrame(animation);

                ctx.clearRect(
                    0,
                    0,
                    canvas.width,
                    canvas.height
                );

            }

        }

        document.addEventListener(
            "pointerdown",
            startAudio,
            { once: true }
        );

        setTimeout(() => {

            startRound();

        }, 600);

    </script>

</body>
</html>
